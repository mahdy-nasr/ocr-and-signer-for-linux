name: Build .deb

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build .deb (Ubuntu ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-pip dpkg-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build .deb
        run: ./packaging/build_deb.sh

      - name: Show package summary
        run: |
          ls -la build/
          dpkg-deb -I build/*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-app-deb-${{ matrix.runner }}
          path: build/*.deb
          retention-days: 14
          if-no-files-found: error
