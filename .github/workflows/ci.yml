name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      PREVIEW_APP_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install apt prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng \
            libxcb-cursor0 libgl1 libegl1 libfontconfig1 \
            libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Syntax check
        run: find src -name '*.py' -print0 | xargs -0 python -m py_compile

      - name: Smoke test (OCR + PDF + signing core paths)
        run: python tests/smoke_test.py

      - name: JPG text-selection regression
        run: python tests/jpg_repro.py

      - name: Signing flow (Apply / Save without Enter)
        run: python tests/sign_flow_test.py

      - name: Signature import/export round-trip
        run: python tests/sig_io_test.py
